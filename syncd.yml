- name: "Renewed purpose"
  # hosts: localhost
  hosts: '{{ host }}'
  gather_facts: false
  # become: true


  vars:
    path_list:
      - { remote: '/mnt/user/nfs', local: '/mnt/nfs11', cld: '/DataVolume/shares/Bump' }
      - { remote: '/mnt/user/vmdata', local: '/mnt/vmdata11', cld: '/DataVolume/shares/dtad' }
      - { remote: '/mnt/user/tmpshr', local: '/mnt/tmpshr11', cld: '/DataVolume/shares/pihad' }
    

  pre_tasks:
    - name: Include cloud_connect role (main)
      ansible.builtin.include_role:
        name: cloud_connect
        tasks_from: main.yml  

    - name: Include cloud_connect role (on)
      ansible.builtin.include_role:
        name: cloud_connect
        tasks_from: on.yml 



  tasks:
    - name: Add mnt folder locations 
      ansible.builtin.file:
        path: "{{ item.local }}"
        state: directory
        # owner: foo
        # group: foo
        mode: '0755'
      loop: '{{ path_list }}'


    - name: Mount NFS volumes
      ansible.posix.mount:
        src: "{{ nfs_srv }}:{{ item.remote }}"
        path: "{{ item.local }}"
        opts: nfsvers=3,rw,relatime,user
        state: mounted
        fstype: nfs
      loop: '{{ path_list }}'
      tags: mount


    - name: Add cld folder locations 
      ansible.builtin.file:
        path: "{{ item.cld }}"
        state: directory

        mode: '0755'
      loop: '{{ path_list }}'

    
    - name: Synchronization using rsync protocol to cld
      shell: rsync --ignore-existing -avhrt  "{{ item.local }}/" "{{ item.cld }}/"
      loop: '{{ path_list }}'
      ignore_errors: yes 
      when: todo is undefined and  (toCld | bool)

    #TODO check space on disk
    - name: Synchronization using rsync protocol to storage 
      shell: rsync --usermap='{{ remote_user }}':'{{ local_user }}' --ignore-existing -avhrt  "{{ item.cld }}/" "{{ item.local }}/"
      loop: '{{ path_list }}'
      ignore_errors: yes 
      when: todo is undefined and (not  (toCld | bool))

    # - name: Change owner of copied local files to {{ local_user }}
    #   ansible.builtin.file:
    #     path: '{{ item.local }}'
    #     owner: '{{ local_user }}'
    #     recurse: true
    #   loop: '{{ path_list }}'
    #   delegate_to: localhost
    #   when: todo is undefined and (not  (toCld | bool))

    - name: Unmount nfs mounted volumes
      ansible.posix.mount:
        path: "{{ item.local }}"
        state: unmounted
      loop: '{{ path_list }}'
      tags: umount

    - name: Remove nfs locations created
      ansible.builtin.file:
        path: "{{ item.local }}"
        state: "absent"
      loop: '{{ path_list }}'

    - name: Pause for 60 seconds before shutdown
      ansible.builtin.pause:
        seconds: 60

    - name: Shutdown device
      shell:  /sbin/shutdown -h -P now

    - name: Pause for 2 minutes to allow for shutdown
      ansible.builtin.pause:
        minutes: 2



  post_tasks:
    - name: Include cloud_connect role (off)
      ansible.builtin.include_role:
        name: cloud_connect
        tasks_from: off.yml 